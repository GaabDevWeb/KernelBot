apiVersion: capability-orchestrator.io/v2
kind: CapabilityGraph
metadata:
  id: "kernel-context-optimization"
  feature: "ContextRouter FAST|NORMAL|DEEP — contexto adaptativo"
  created_at: "2026-08-09T16:30:00Z"
  planner_version: "1.0.0"
  ir_version: "2.0.0"
  policy_ref: high-reliability

spec:
  global_inputs:
    - id: baseline
      source: artifact
      path: optimization/baseline.md
    - id: context-architecture
      source: artifact
      path: docs/CONTEXT-ARCHITECTURE.md
    - id: plan-markdown
      source: artifact
      path: memory/kernel-context-optimization/PLAN.md

  global_outputs:
    - id: routing-design
      path: optimization/routing.md
    - id: benchmark-report
      path: optimization/benchmark.md
    - id: results-report
      path: optimization/results.md
    - id: context-route-contract
      path: docs/contracts/context-route-v1.md

  assumptions:
    - "S1: cohort pós-camadas expandirá para ≥20 traces antes do benchmark final (baseline §9)"
    - "S2: flag env ACL_CONTEXT_ROUTER (nome exacto fixado no contrato ID 2) default off até hard gates"
    - "S3: calendar-only puro é distinguível por heurística determinística + testes golden"
    - "Cache de respostas LLM que bypass transcript está fora de escopo (proibido)"

  out_of_scope:
    - "Alteração de código de produto na fase de planeamento (já cumprida com PLAN.md + plan.ir.yaml)"
    - "Cache de respostas LLM / bypass de transcript"
    - "Reescrita do motor BM25"
    - "Classificador LLM de intent"
    - "UI do painel de traces além de campos em stages/snapshots"
    - "Remoção de providers Temporal/Calendar/Institutional/RAG/Transcript"

  nodes:
    - id: docs-routing
      capability: documentation
      type: worker
      metadata:
        estimated_effort: M
        priority: 100
        tags: [routing, design-freeze]
        plan_id: 1
      inputs:
        - ref: global_inputs.baseline
        - ref: global_inputs.plan-markdown
      outputs:
        - id: routing-md
          path: optimization/routing.md
          schema: artifacts/design-spec@1.0.0
      dependencies: []
      definition_of_done:
        - id: dod-routing-1
          check: "optimization/routing.md publica matriz sinal→perfil→camadas, golden e caps; proíbe cache de respostas"
          verification: evidence

    - id: contract-context-route
      capability: api-contract
      type: worker
      metadata:
        estimated_effort: M
        priority: 95
        tags: [contrato, ContextRoute]
        plan_id: 2
      inputs:
        - ref: docs-routing.outputs.routing-md
      outputs:
        - id: context-route-v1
          path: docs/contracts/context-route-v1.md
          schema: contracts/api@1.0.0
      dependencies: [docs-routing]
      definition_of_done:
        - id: dod-contract-1
          check: "Contrato ContextRoute v1 com profile, include_*, budgets, rag_skip_reason, flag env default off; nomes estáveis para implementação"
          verification: evidence

    - id: be-context-router
      capability: backend-implementation
      type: worker
      metadata:
        estimated_effort: M
        priority: 90
        tags: [router, FAST, NORMAL, DEEP]
        plan_id: 3
      inputs:
        - ref: contract-context-route.outputs.context-route-v1
      outputs:
        - id: router-module
          path: kernel/context/router.py
          schema: artifacts/backend-module@1.0.0
      dependencies: [contract-context-route]
      definition_of_done:
        - id: dod-router-1
          check: "ContextRouter puro: time_fact→FAST; force_rag≠FAST; golden da matriz verdes em pytest"
          verification: automated

    - id: be-institutional-ondemand
      capability: backend-implementation
      type: worker
      metadata:
        estimated_effort: M
        priority: 80
        tags: [institutional, H3]
        plan_id: 4
      inputs:
        - ref: be-context-router.outputs.router-module
        - ref: contract-context-route.outputs.context-route-v1
      outputs:
        - id: institutional-selective
          path: kernel/context/institutional.py
      dependencies: [be-context-router]
      definition_of_done:
        - id: dod-inst-1
          check: "FAST time_fact: institutional_files vazio; allowlist por route sem apagar ficheiros em disco"
          verification: automated

    - id: be-calendar-ondemand
      capability: backend-implementation
      type: worker
      metadata:
        estimated_effort: M
        priority: 80
        tags: [calendar, H2]
        plan_id: 5
      inputs:
        - ref: be-context-router.outputs.router-module
        - ref: contract-context-route.outputs.context-route-v1
      outputs:
        - id: calendar-selective
          path: kernel/context/calendar_provider.py
      dependencies: [be-context-router]
      definition_of_done:
        - id: dod-cal-1
          check: "FAST: calendar_events_used==0 e bloco vazio; NORMAL/DEEP respeitam caps do contrato"
          verification: automated

    - id: be-rag-adaptive
      capability: backend-implementation
      type: worker
      metadata:
        estimated_effort: M
        priority: 80
        tags: [rag, H4]
        plan_id: 6
      inputs:
        - ref: be-context-router.outputs.router-module
        - ref: contract-context-route.outputs.context-route-v1
      outputs:
        - id: rag-adaptive
          path: kernel/orchestrator/context.py
      dependencies: [be-context-router]
      definition_of_done:
        - id: dod-rag-1
          check: "Skip alargado (time_fact, cumprimentos, calendar-only puro); filtro inject confidence=low; force_* anula skip"
          verification: automated

    - id: be-observability
      capability: backend-implementation
      type: worker
      metadata:
        estimated_effort: M
        priority: 70
        tags: [trace, observability]
        plan_id: 7
      inputs:
        - ref: be-context-router.outputs.router-module
      outputs:
        - id: trace-fields
          path: kernel/trace/
      dependencies: [be-context-router]
      definition_of_done:
        - id: dod-obs-1
          check: "Stages/snapshot expõem context_profile, flags de camadas e rag_skip_reason comparáveis ao baseline"
          verification: automated

    - id: be-transcript-adaptive
      capability: backend-implementation
      type: worker
      metadata:
        estimated_effort: M
        priority: 70
        tags: [transcript, H5]
        plan_id: 8
      inputs:
        - ref: be-context-router.outputs.router-module
        - ref: contract-context-route.outputs.context-route-v1
      outputs:
        - id: transcript-adaptive
          path: kernel/orchestrator/context.py
      dependencies: [be-context-router]
      definition_of_done:
        - id: dod-tr-1
          check: "Turns de prompt por perfil (FAST≤2); sem cache de respostas; store não bypassado"
          verification: automated

    - id: be-budgets
      capability: backend-implementation
      type: worker
      metadata:
        estimated_effort: M
        priority: 60
        tags: [budgets, H6]
        plan_id: 9
      inputs:
        - ref: be-institutional-ondemand.outputs.institutional-selective
        - ref: be-calendar-ondemand.outputs.calendar-selective
        - ref: be-rag-adaptive.outputs.rag-adaptive
        - ref: be-transcript-adaptive.outputs.transcript-adaptive
      outputs:
        - id: budget-enforcer
          path: kernel/context/
      dependencies:
        - be-institutional-ondemand
        - be-calendar-ondemand
        - be-rag-adaptive
        - be-transcript-adaptive
      definition_of_done:
        - id: dod-bud-1
          check: "Caps duros por perfil aplicados (trim determinístico); assemble não excede budgets do contrato"
          verification: automated

    - id: test-context-suite
      capability: testing
      type: gate
      metadata:
        estimated_effort: L
        priority: 50
        tags: [pytest, regression]
        plan_id: 10
      inputs:
        - ref: be-context-router.outputs.router-module
        - ref: be-budgets.outputs.budget-enforcer
        - ref: be-observability.outputs.trace-fields
      outputs:
        - id: test-report
          path: memory/kernel-context-optimization/test-report.md
          schema: evidence/test-report@1.0.0
      dependencies:
        - be-context-router
        - be-institutional-ondemand
        - be-calendar-ondemand
        - be-rag-adaptive
        - be-observability
        - be-transcript-adaptive
        - be-budgets
      definition_of_done:
        - id: dod-test-1
          check: "pytest tests/test_context_*.py tests/test_context_router*.py verde; flag off preserva legacy"
          verification: automated
      gate:
        on_reject: invalidate_downstream
        verdict_required: true

    - id: research-benchmark
      capability: research-spike
      type: worker
      metadata:
        estimated_effort: M
        priority: 40
        tags: [benchmark, results, baseline]
        plan_id: 11
      inputs:
        - ref: test-context-suite.outputs.test-report
        - ref: be-observability.outputs.trace-fields
        - ref: global_inputs.baseline
      outputs:
        - id: benchmark-md
          path: optimization/benchmark.md
        - id: results-md
          path: optimization/results.md
      dependencies: [test-context-suite, be-observability]
      definition_of_done:
        - id: dod-bench-1
          check: "benchmark.md + results.md com deltas vs baseline; hard gates time_fact (≤2500 tok, calendar=0, institutional=0) ou gap com decisão go/no-go"
          verification: evidence

    - id: docs-architecture-env
      capability: documentation
      type: gate
      metadata:
        estimated_effort: S
        priority: 30
        tags: [docs, env]
        plan_id: 12
      inputs:
        - ref: research-benchmark.outputs.results-md
        - ref: contract-context-route.outputs.context-route-v1
      outputs:
        - id: arch-update
          path: docs/CONTEXT-ARCHITECTURE.md
      dependencies: [research-benchmark]
      definition_of_done:
        - id: dod-docs-1
          check: "CONTEXT-ARCHITECTURE.md descreve ContextRouter/perfis; .env.example documenta flag"
          verification: evidence
      gate:
        verdict_required: true

  edges:
    - from: docs-routing
      to: contract-context-route
      type: data
    - from: contract-context-route
      to: be-context-router
      type: data
    - from: be-context-router
      to: be-institutional-ondemand
      type: data
    - from: be-context-router
      to: be-calendar-ondemand
      type: data
    - from: be-context-router
      to: be-rag-adaptive
      type: data
    - from: be-context-router
      to: be-observability
      type: data
    - from: be-context-router
      to: be-transcript-adaptive
      type: data
    - from: be-institutional-ondemand
      to: be-budgets
      type: data
    - from: be-calendar-ondemand
      to: be-budgets
      type: data
    - from: be-rag-adaptive
      to: be-budgets
      type: data
    - from: be-transcript-adaptive
      to: be-budgets
      type: data
    - from: be-budgets
      to: test-context-suite
      type: ordering
    - from: test-context-suite
      to: research-benchmark
      type: data
    - from: research-benchmark
      to: docs-architecture-env
      type: data
