{% extends "base.html" %}
{% block title %}Templates{% endblock %}
{% block content %}
<div class="page-head">
  <h1>Templates</h1>
  <p class="sub">Variáveis: <code>{hora}</code> <code>{link}</code> <code>{mensagem}</code></p>
</div>
<div class="panel">
  <h2>Novo template</h2>
  <form method="post" action="/ops/comms/templates">
    <label>Nome <input name="name" required style="width:100%;min-height:2.5rem;margin:0.35rem 0" /></label>
    <label>Corpo <textarea name="body" rows="6" required style="width:100%;font-family:var(--mono);margin:0.35rem 0"></textarea></label>
    <button class="btn" type="submit">Guardar</button>
  </form>
</div>
<div class="panel">
  <h2>Existentes</h2>
  {% for t in items %}
  <div style="margin-bottom:1rem;padding-bottom:1rem;border-bottom:1px solid var(--line)">
    <strong>{{ t.name }}</strong>
    <pre style="white-space:pre-wrap;font-size:0.85rem">{{ t.body }}</pre>
  </div>
  {% else %}
  <p>Sem templates.</p>
  {% endfor %}
</div>
{% endblock %}
