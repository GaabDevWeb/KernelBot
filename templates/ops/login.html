<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Login — Kernel Ops</title>
  <link rel="stylesheet" href="/ops-static/styles.css" />
</head>
<body>
  <div class="login-wrap">
    <h1>Kernel Ops</h1>
    <p class="sub">Autenticação com token interno (`ACL_INTERNAL_BEARER_TOKEN`).</p>
    {% if error %}<p class="err" role="alert">{{ error }}</p>{% endif %}
    <form method="post" action="/ops/login">
      <label for="token">Token</label>
      <input id="token" name="token" type="password" autocomplete="current-password" required />
      <p style="margin-top:1rem"><button type="submit" class="btn">Entrar</button></p>
    </form>
  </div>
</body>
</html>
