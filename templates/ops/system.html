{% extends "base.html" %}
{% block title %}Sistema — Kernel Ops{% endblock %}
{% block content %}
<div class="page-head">
  <h1>Sistema</h1>
  <p class="sub">Recursos do processo Kernel · actualização automática a cada 5s.</p>
</div>

<div id="sys-panel">
  {% include "system_partial.html" %}
</div>
{% endblock %}
{% block scripts %}
<script>
(function () {
  const panel = document.getElementById("sys-panel");
  if (!panel) return;
  async function tick() {
    try {
      const res = await fetch("/ops/system", { headers: { "HX-Request": "true" }, credentials: "same-origin" });
      if (!res.ok) return;
      const html = await res.text();
      panel.innerHTML = html;
    } catch (_) { /* ignore */ }
  }
  setInterval(tick, 5000);
})();
</script>
{% endblock %}
